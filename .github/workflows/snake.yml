name: Generate GitHub Contribution Snake

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p ./images

      - name: Generate snake grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/github-snake.svg
            images/github-snake-dark.svg?palette=github-dark
            images/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      - name: Push changes to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新GitHub贡献蛇形图"
          file_pattern: ./images/*
          skip_fetch: true
          skip_checkout: true
