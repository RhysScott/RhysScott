name: Generate GitHub Contribution Snake

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create images directory
        run: mkdir -p /github/workspace/images

      - name: Generate snake grid
        uses: Platane/snk@v3
        with:
          github_user_name: RhysScott
          args: --output-dir /github/workspace/images --dark-mode

      - name: Push changes to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新GitHub贡献蛇形图"
          file_pattern: ./images/*.svg
          skip_fetch: true
          skip_checkout: true
